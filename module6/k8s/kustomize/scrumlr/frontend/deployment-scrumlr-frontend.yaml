apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrumlr-frontend
  labels:
    app.kubernetes.io/name: "scrumlr"
    app.kubernetes.io/component: "frontend"
    app.kubernetes.io/part-of: "scrumlr"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: "scrumlr"
      app.kubernetes.io/component: "frontend"
      app.kubernetes.io/part-of: "scrumlr"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "scrumlr"
        app.kubernetes.io/component: "frontend"
        app.kubernetes.io/part-of: "scrumlr"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: "scrumlr"
              app.kubernetes.io/component: "frontend"
              app.kubernetes.io/part-of: "scrumlr"
      containers:
        - name: frontend
          image: ghcr.io/inovex/scrumlr.io/scrumlr-frontend:4.4.0
          resources:
            requests:
              cpu: "25m"
              memory: "100Mi"
            limits:
              memory: "100Mi"
          envFrom:
            - configMapRef:
                name: scrumlr-frontend
          ports:
            - containerPort: 8080
